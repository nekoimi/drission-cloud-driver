server:
  port: "8091"
  mode: release
  timezone: "Asia/Shanghai"
  shutdown_timeout: 10
  allowed_origins:
    - "https://your-domain.com"

cloak:
  base_url: ${CLOAK_BASE_URL}
  api_key: ${CLOAK_API_KEY}

drivers:
  default_timeout: 30
  platforms:
    - "115"

offline:
  store:
    driver: "sqlite"
    dsn: "./data/offline_tasks.db"

rate_limit:
  enabled: true
  rps: 100
  burst: 200
