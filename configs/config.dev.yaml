server:
  port: "8080"
  mode: debug
  timezone: "Asia/Shanghai"
  shutdown_timeout: 10
  allowed_origins: []

cloak:
  base_url: "https://cloakbrowser-manager.home.sakuraio.com"
  api_key: ""

drivers:
  default_timeout: 30
  platforms:
    - "115"

offline:
  store:
    driver: "sqlite"
    dsn: "./data/offline_tasks.dev.db"

rate_limit:
  enabled: false
  rps: 100
  burst: 200
