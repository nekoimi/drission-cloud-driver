server:
  port: "8091"
  mode: release
  timezone: "Asia/Shanghai"
  shutdown_timeout: 10
  allowed_origins:
    - "https://your-domain.com"

cloak:
  base_url: ${CLOAK_BASE_URL}
  api_key: ${CLOAK_API_KEY}

drivers:
  default_timeout: 30
  platforms:
    - "115"

offline:
  store:
    driver: "postgres"
    dsn: ${OFFLINE_STORE_DSN}
  sync:
    enabled: true
    interval_seconds: 15
    cleanup_completed: true
    cleanup_grace_seconds: 30

rate_limit:
  enabled: true
  rps: 100
  burst: 200

modules:
  browser:
    enabled: true
  driver:
    enabled: true
