server:
  port: "8091"
  mode: debug
  timezone: "Asia/Shanghai"
  shutdown_timeout: 10
  allowed_origins: []

cloak:
  base_url: "https://cloakbrowser-manager.home.sakuraio.com"
  api_key: ""

drivers:
  default_timeout: 30
  platforms:
    - "115"

offline:
  store:
    driver: "postgres"
    dsn: "postgres://drission:drission@localhost:5432/drission_cloud_driver?sslmode=disable"

rate_limit:
  enabled: false
  rps: 100
  burst: 200

modules:
  browser:
    enabled: true
  driver:
    enabled: true
