server:
  port: "8081"
  mode: debug
  timezone: "Asia/Shanghai"
  shutdown_timeout: 10
  allowed_origins: []

cloak:
  base_url: "http://localhost:3000"
  api_key: ""

drivers:
  default_timeout: 30
  platforms:
    - "115"

offline:
  store:
    driver: "memory"
    dsn: ""
  sync:
    enabled: false
    interval_seconds: 15
    cleanup_completed: false
    cleanup_grace_seconds: 30

rate_limit:
  enabled: false
  rps: 100
  burst: 200
